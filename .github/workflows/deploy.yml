# =====================================
# GitHub Actions CI/CD Pipeline
# =====================================
# This workflow automatically builds, tests, and deploys the VartaIQ application
# 
# Triggers:
#   - Push to main branch
#   - Manual trigger via GitHub Actions UI
#
# Stages:
#   1. CI (Continuous Integration): Lint and test the code
#   2. CD (Continuous Deployment): Build Docker image and deploy to production
#
# Container Registry: GitHub Container Registry (ghcr.io)
# No Docker Hub required - everything stays in GitHub!

name: VartaIQ CI/CD Pipeline

# =====================================
# Trigger Conditions
# =====================================
on:
  # Trigger on push to main branch
  push:
    branches:
      - main
  
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

# =====================================
# Environment Variables
# =====================================
# These are available to all jobs in the workflow
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.11'
  

# =====================================
# Jobs
# =====================================
jobs:
  
  # =====================================
  # JOB 1: Continuous Integration (CI)
  # =====================================
  # This job runs linting and tests to ensure code quality
  
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # Step 2: Set up Python 3.11
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'  # Cache pip dependencies for faster builds
      
      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-asyncio httpx
      
      # Step 4: Run linting with flake8
      # Flake8 checks for code style issues and common errors
      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          
          # Exit-zero treats all errors as warnings
          # Max line length set to 127 characters (common standard)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: false  # Fail the job if linting fails
      
      # Step 5: Run tests (if test files exist)
      # This step will skip gracefully if no tests are found
      - name: Run Tests
        run: |
          if [ -d "tests" ]; then
            echo "Running tests..."
            pytest tests/ -v
          else
            echo "No tests directory found. Skipping tests."
          fi
        continue-on-error: false  # Fail the job if tests fail
  
  # =====================================
  # JOB 2: Continuous Deployment (CD)
  # =====================================
  # This job builds the Docker image and deploys to production
  # It only runs if the CI job succeeds
  
  cd:
    name: Continuous Deployment
    runs-on: ubuntu-latest
    needs: ci  # This job depends on the CI job succeeding
    permissions:
      contents: read
      packages: write  # Required to push to GitHub Container Registry
    
    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # Step 2: Convert repository name to lowercase
      # GitHub Container Registry requires lowercase names
      - name: Set lowercase image name
        id: image
        run: |
          echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      
      # Step 3: Set up Docker Buildx
      # Buildx is an advanced Docker build tool with better caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Step 4: Log in to GitHub Container Registry
      # Uses GitHub's built-in GITHUB_TOKEN (no manual token needed!)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Step 5: Extract metadata for Docker image
      # This generates tags and labels for the Docker image
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      
      # Step 6: Build and push Docker image to GitHub Container Registry
      # This builds the image and pushes it to ghcr.io
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache,mode=max
      
      # Step 7: Deploy to Production Server
      # This connects to the production server via SSH and deploys the new image
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: IMAGE_NAME
          script: |
            # Navigate to application directory
            cd ~/vartaiq-app || exit 1
            
            # Log in to GitHub Container Registry
            # Using DOCKER_TOKEN secret (which should contain a GitHub Personal Access Token)
            echo "${{ secrets.DOCKER_TOKEN }}" | docker login ghcr.io -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            
            # Pull the latest Docker image from GitHub Container Registry
            docker pull ghcr.io/${IMAGE_NAME}:latest
            
            # Stop the old container (if running)
            docker stop vartaiq-ai-analyzer 2>/dev/null || true
            docker rm vartaiq-ai-analyzer 2>/dev/null || true
            
            # Start the new container
            # --name: Container name for easy reference
            # --restart unless-stopped: Automatically restart on failure
            # -p 8000:8000: Map port 8000 from container to host
            # --env-file: Pass environment variables from .env file
            # -d: Run in detached mode (background)
            docker run -d \
              --name vartaiq-ai-analyzer \
              --restart unless-stopped \
              -p 8000:8000 \
              --env-file .env \
              ghcr.io/${IMAGE_NAME}:latest
            
            # Wait for container to start
            sleep 10
            
            # Check if container is running
            if [ "$(docker ps -q -f name=vartaiq-ai-analyzer)" ]; then
              echo "✅ Container started successfully"
              
              # Test the health endpoint
              if curl -f http://localhost:8000/health; then
                echo "✅ Health check passed"
              else
                echo "❌ Health check failed"
                exit 1
              fi
            else
              echo "❌ Container failed to start"
              docker logs vartaiq-ai-analyzer
              exit 1
            fi
            
            # Clean up old Docker images to save disk space
            docker image prune -af --filter "until=24h"
      
      # Step 8: Notify on Success
      - name: Deployment Success
        if: success()
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "Application is now running at http://${{ secrets.SERVER_HOST }}:8000"
          echo "Health check: http://${{ secrets.SERVER_HOST }}:8000/health"
          echo "API Docs: http://${{ secrets.SERVER_HOST }}:8000/docs"
          echo "Docker image: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest"
      
      # Step 9: Notify on Failure
      - name: Deployment Failed
        if: failure()
        run: |
          echo "❌ Deployment failed. Check the logs above for details."
          echo "To rollback, SSH into the server and run:"
          echo "docker stop vartaiq-ai-analyzer && docker rm vartaiq-ai-analyzer"
          echo "docker run -d --name vartaiq-ai-analyzer --restart unless-stopped -p 8000:8000 --env-file .env ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:<previous-tag>"
