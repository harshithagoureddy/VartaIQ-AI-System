name: VartaIQ CI Pipeline

on:
  push:
    # Triggers on your current branch. Replace with your actual branch name if different.
    branches: [ main, feature-updated-branch ] 
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository code
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 2. Set up Python (Useful for linting FastAPI code if needed)
    - name: Set up Python
      uses: actions/checkout@v4
      # Note: You can add flake8/pytest steps here later if you have unit tests

    # 3. Create a dummy .env file
    # Your docker-compose expects a .env file. We mock it here so the build doesn't crash.
    - name: Create mock .env file
      run: |
        echo "DATABASE_URL=mock_value" >> .env
        echo "HF_API_TOKEN=mock_value" >> .env

    # 4. Build the Docker Image using Docker Compose
    - name: Build Docker Image
      run: docker compose build

    # 5. Start the application container in the background
    - name: Start Container
      run: docker compose up -d

    # 6. Wait and verify the application Health Check
    # This loops and tests the health endpoint exactly like your compose file does
    - name: Verify App Health Check
      run: |
        echo "Waiting for application to start..."
        sleep 15
        for i in {1..6}; do
          if curl -f http://localhost:8000/health; then
            echo "Success: VartaIQ application is healthy!"
            exit 0
          fi
          echo "App not ready yet, retrying in 5 seconds ($i/6)..."
          sleep 5
        done
        echo "Error: Application failed health check."
        docker compose logs
        exit 1

    # 7. Shut down the containers safely
    - name: Stop Containers
      if: always()
      run: docker compose down












